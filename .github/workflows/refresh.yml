name: refresh video list

on:
  schedule:
    - cron: '17 */6 * * *'      # 6時間ごと（UTC）
  workflow_dispatch:            # Actions タブの "Run workflow" から手動実行

permissions:
  contents: write               # videos.json をコミットするため

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install --upgrade yt-dlp

      - name: Unit tests (strict filter)
        continue-on-error: true
        run: python -m unittest discover -s tests

      # 厳格: 長さが分かっていて 20秒以上10分未満・ライブ/配信アーカイブでない動画だけを残す。長さ不明の動画は1回に最大 RESOLVE_MAX 本ずつ調べる（残りは次回）
      # 失敗したとき（全チャンネル取得不可 / 前回の有効分の50%未満 / エラー）は終了コード1で止まり、コミットされません
      - name: Refresh video list
        env:
          RESOLVE_MAX: '150'
        run: python refresh_site.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json state.json index.html native.html
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Update video list"
          git pull --rebase
          git push
